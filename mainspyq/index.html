<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mainspyq</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- STICKY TOPBAR -->
  <header class="app-topbar">
    <div class="topbar-left">
      <a href="../" class="back-link" title="Return to Portal">&larr;</a>
      <span class="compact-brand">mainspyq</span>
      <span class="badge badge-accent">ARCHIVE</span>
    </div>

    <!-- Center Inline Controls -->
    <div class="topbar-center">
      <!-- Dynamic Paper Filter -->
      <div class="filter-item">
        <label for="paperSelector">Paper:</label>
        <select id="paperSelector" class="compact-input" aria-label="Select Examination Paper">
          <option value="">Detecting papers...</option>
        </select>
      </div>

      <!-- Dynamic Year Filter -->
      <div class="filter-item">
        <label for="yearSelector">Year:</label>
        <select id="yearSelector" class="compact-input" aria-label="Select Examination Year">
          <option value="">Loading Years...</option>
        </select>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="topbar-right">
      <button id="fullMockTimerBtn" class="btn btn-timer-action" title="Start 3-Hour Exam Timer">
        ⏱ 3-Hour Timer
      </button>
      <button id="printBtn" class="btn btn-outline" title="Print or save as PDF">
        🖨 Print Paper
      </button>
    </div>
  </header>

  <!-- QUESTION PAPER CANVAS -->
  <main class="paper-wrapper">
    <div class="paper-inner-frame" id="paperCanvas">
      <div class="state-message">
        <div class="state-spinner"></div>
        <p>Initializing Question Paper Archive...</p>
      </div>
    </div>
  </main>

  <!-- FLOATING ANSWER PRACTICE STOPWATCH -->
  <aside id="stopwatchWidget" class="floating-stopwatch minimized" aria-live="polite">
    <div class="timer-top-row">
      <span id="timerContextLabel" class="timer-context">Question Practice</span>
      <button id="timerCloseBtn" class="timer-close-btn" title="Hide Timer">&times;</button>
    </div>
    <div id="timerDisplay" class="timer-display">00:00</div>
    <div class="timer-controls-row">
      <button id="timerToggleBtn" class="timer-btn timer-btn-primary">Start</button>
      <button id="timerResetBtn" class="timer-btn timer-btn-secondary">Reset</button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
